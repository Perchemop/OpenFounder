<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OpenFounder mark: a caliper measuring a question mark">
  <title>OpenFounder</title>
  <!-- Caliper frame -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="3" opacity="0.35" />
  <!-- Upper jaw -->
  <path d="M9 24 H20" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
  <!-- Lower jaw -->
  <path d="M44 40 H55" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
  <!-- Measured question mark -->
  <path
    d="M26 22c0-4.5 3.6-7.5 8-7.5 5 0 8 3.2 8 7.6 0 4.4-3.4 6.6-6 8.6-1.6 1.2-2.2 2.4-2.2 4.1"
    fill="none"
    stroke="currentColor"
    stroke-width="4.5"
    stroke-linecap="round"
  />
  <circle cx="33.8" cy="40.5" r="2.8" fill="currentColor" />
</svg>
