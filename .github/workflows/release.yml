name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing semver tag to release (for example v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build static app
        run: bun run build:static

      - name: Package artefacts
        run: |
          set -euo pipefail
          mkdir -p release
          tag="${GITHUB_REF_NAME}"
          tar -C dist -czf "release/openfounder-dist-${tag}.tar.gz" .
          (cd dist && find . -type f | sort | xargs sha256sum > "../release/checksums.txt")
      - name: Copy example project
        run: cp public/assets/example-project-tradepulse.json release/example-project-tradepulse.json
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: release/sbom.spdx.json

      - name: Scan release assets for personal data
        # Guide II.29.6 / II.24.3: the published surface is scanned, not just the
        # clone. The tarball is extracted so an embedded build path is checked too.
        run: |
          set -euo pipefail
          mkdir -p /tmp/asset-scan
          tar -xzf "release/openfounder-dist-${GITHUB_REF_NAME}.tar.gz" -C /tmp/asset-scan
          bash scripts/scan-personal-data.sh --path /tmp/asset-scan
          bash scripts/scan-personal-data.sh --path release

      - name: Upload build artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openfounder-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish (GitHub Release)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download build artefact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: openfounder-${{ github.ref_name }}
          path: release

      - name: Compose release body from CHANGELOG
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          section="$(mktemp)"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$section"
          {
            echo "## Release notes"
            echo ""
            if [ -s "$section" ]; then
              cat "$section"
            else
              echo "_No \`${version}\` entry in CHANGELOG.md yet. Add one before announcing the release._"
            fi
            echo ""
            echo "## Artefacts"
            echo ""
            archive="release/openfounder-dist-${tag}.tar.gz"
            if [ -f "$archive" ]; then
              echo "- openfounder-dist-${tag}.tar.gz (\`$(sha256sum "$archive" | cut -d" " -f1)\`)"
            fi
            echo "- checksums.txt (SHA-256 of every packaged file)"
            echo "- sbom.spdx.json (SPDX SBOM for licence and supply-chain transparency)"
            echo "- example-project-tradepulse.json (example workspace export to import and explore OpenFounder's features)"
          } > release/body.md
          cat release/body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenFounder ${{ github.ref_name }}
          body_path: release/body.md
          draft: true
          files: |
            release/openfounder-dist-${{ github.ref_name }}.tar.gz
            release/checksums.txt
            release/sbom.spdx.json
            release/example-project-tradepulse.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
