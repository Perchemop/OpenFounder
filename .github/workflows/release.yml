name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing semver tag to release (for example v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build static app
        run: bun run build:static

      - name: Package artefacts
        run: |
          set -euo pipefail
          mkdir -p release
          tag="${GITHUB_REF_NAME}"
          tar -C dist -czf "release/openfounder-dist-${tag}.tar.gz" .
          (cd dist && find . -type f | sort | xargs sha256sum > "../release/checksums.txt")

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: openfounder-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish (GitHub Release)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: openfounder-${{ github.ref_name }}
          path: release

      - name: Compose release body from CHANGELOG
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          section="$(mktemp)"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$section"
          {
            echo "## Release notes"
            echo ""
            if [ -s "$section" ]; then
              cat "$section"
            else
              echo "_No \`${version}\` entry in CHANGELOG.md yet. Add one before announcing the release._"
            fi
            echo ""
            echo "## Artefacts"
            echo ""
            archive="release/openfounder-dist-${tag}.tar.gz"
            if [ -f "$archive" ]; then
              echo "- openfounder-dist-${tag}.tar.gz (\`$(sha256sum "$archive" | cut -d" " -f1)\`)"
            fi
            echo "- checksums.txt (SHA-256 of every packaged file)"
          } > release/body.md
          cat release/body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenFounder ${{ github.ref_name }}
          body_path: release/body.md
          draft: true
          files: |
            release/openfounder-dist-${{ github.ref_name }}.tar.gz
            release/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
