name: Accessibility report
description: Report a barrier for users with disabilities
title: "[a11y] "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Accessibility reports are expertise. Please be specific about the barrier you encountered.
  - type: input
    id: page
    attributes:
      label: Page / component
      placeholder: GoalsPage
    validations:
      required: true
  - type: textarea
    id: assistive
    attributes:
      label: Assistive technology and AT settings
      description: Screen reader, browser, OS, zoom, high contrast, reduced motion, etc.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior (what you heard/saw)
    validations:
      required: true
  - type: textarea
    id: severity
    attributes:
      label: Severity
      description: Blocker / Major / Minor
